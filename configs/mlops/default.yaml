# 実験管理。3つとも既定でONで、3つともローカル完結。アカウントもAPIキーも
# ネットワークも要らない。その組み合わせが、データを機外に出せない案件で
# 使える条件になる。
#
#   MLflow      実行の台帳。パラメータ、指標、成果物、そしてどの ONNX が
#               「優勝」かを決めるモデルレジストリ。これが記録の正本で、
#               src/infer.py は何を出荷するかをここから読む。
#   W&B         生の眺め。走っている最中に見る学習曲線と、
#               （ARM_BCRL006 では）推論を含む全方策の閉ループ評価を、
#               表と棒グラフで残す。1つのページで「良くなったのか」に
#               答えられるようにするため。
#   TensorBoard デバッグ用。stable-baselines3 が自分で書く反復ごとの
#               PPO スカラー（価値損失、エントロピー、説明分散、KL）。
#               RL が崩れたときに理由を言える解像度を持つのは、3つの
#               中でこれだけ。
mlflow:
  tracking_uri: sqlite:///${oc.env:PWD}/artifacts/mlflow.db
  experiment_name: arm_bcrl006_pickplace
wandb:
  enabled: true
  mode: offline          # offline | online | disabled。
                         # offline はアカウント無しで artifacts/wandb に本物の
                         # run を書く。後から `wandb sync` で上げられるし、
                         # `wandb login` 後に mode=online にすれば生で流れる。
  project: arm_bcrl006_pickplace
  dir: ${oc.env:PWD}/artifacts/wandb
tensorboard:
  enabled: true
  dir: ${oc.env:PWD}/artifacts/tb
