# PPO fine-tuning FROM the BC weights -- stable-baselines3.
#
# WHY SB3 AND NOT RSL-RL (which ARM_BCRL005 used): RSL-RL's runner is written
# against Isaac Lab's vectorised-env wrapper and is not usable outside it
# without re-implementing that wrapper against a moving API. stable-baselines3
# is the mainstream general-purpose RL library, its VecEnv contract is stable
# and documented, it writes TensorBoard scalars natively, and it has a first-
# party W&B callback. The ALGORITHM is the same clipped-objective PPO and every
# stabiliser ARM_BCRL005 needed is carried over (see below and
# change log §8).
num_envs: 64                 # MuJoCo is CPU; 64 arms in one model steps at
                             # ~4k env-steps/s on the reference machine, which
                             # is the sweet spot between batch size and latency
rollout_steps: 32            # 64 * 32 = 2048 samples per iteration
total_iterations: 300        # ~614k env-steps
select_best_checkpoint: true # RL does not improve monotonically. Ship the
                             # checkpoint that measures best in CLOSED LOOP,
                             # not the last iteration.
save_interval: 25

gamma: 0.99
lam: 0.95
clip: 0.2
entropy_coef: 0.005
value_coef: 1.0
lr: 0.0001                   # fine-tuning from a good initialisation; 3e-4 is
                             # too large and was one of the four causes of the
                             # ARM_BCRL005 collapse
target_kl: 0.02
max_grad_norm: 1.0
epochs: 5
minibatches: 4
hidden: [256, 128, 64]       # MUST equal bc.hidden
activation: relu             # MUST match robomimic's MLP default
init_noise_std: 0.1
output_activation: tanh      # robomimic's BC head ends in tanh; the PPO actor
                             # gets the same head so the transferred weights
                             # reproduce the BC policy exactly
bc_init: true                # false = PPO from scratch (the ablation that
                             # quantifies what the initialisation buys)

# --- the four stabilisers, in order of effect ---------------------------
# ARM_BCRL005's first real run watched a BC policy at success 0.606 collapse to
# 0.000 over 600 PPO iterations. The cause was NOT reward hacking or entropy
# collapse: the critic diverged. A randomly-initialised critic facing BC-policy
# returns of 800-1900 (the success_time_bonus pays up to ~2390 in one terminal
# step) produced a value loss of 4e4, so advantage = returns - values was pure
# noise and PPO pushed the policy along it. Once the policy never succeeds, the
# sparse success gradient is gone and it cannot come back.
reward_normalization: true   # 1. divide rewards by the running std of the
                             #    discounted return -- puts the critic's
                             #    regression target at O(1). This is the direct
                             #    fix for the root cause (Engstrom et al. 2020;
                             #    stable-baselines VecNormalize).
reward_norm_clip: 10.0
critic_warmup_iters: 40      # 2. freeze the actor for the first N iterations
                             #    and fit the critic to the BC policy's returns
bc_anchor_coef: 1.0          # 4. pull the actor back toward the BC snapshot
bc_anchor_decay_iters: 260   #    every iteration, decaying to zero so RL can
bc_anchor_min_coef: 0.0      #    still surpass BC. Same idea as the KL-to-SFT
bc_anchor_lr: 0.0001         #    penalty in RLHF, and as DAPG's BC gradient
bc_anchor_minibatch: 2048    #    term (Rajeswaran et al. 2018).
promote_requires_bc_parity: true   # a policy that measures WORSE than BC in
promote_bc_parity_tol: 0.0         # closed loop must not overwrite the
                                   # deployed teacher phase 7 distils from
