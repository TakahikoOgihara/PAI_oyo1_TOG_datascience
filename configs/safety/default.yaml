# Policy-independent safety layer for the real robot (deploy/raspi/safety.py).
# Unchanged from ARM_BCRL005: the simulator enforces the SAME envelope through
# the SAME forward kinematics (deploy/raspi/mycobot_fk.py), so what the policy
# learns is what the hardware runs. src/infer.py ships this block inside
# edge_config.json -- no constant is ever hand-copied onto the robot.
max_joint_step: 0.10      # rad per 20 Hz tick, per joint
floor_z: 0.0              # bench top in the robot base frame. 0 = arm bolted
                          # flat on the bench; MEASURE it if it sits on a riser
floor_clearance: 0.005    # 5 mm. The expert grasp pose clears the plane by
                          # 13 mm, so the guard never fires in normal operation
stall_err: 0.10           # rad of tracking error that counts as "blocked"
stall_ticks: 8            # consecutive ticks (8 * 0.05 s = 0.4 s) before the
                          # latching stop fires
retreat_rad: 0.05         # back off this much AGAINST the push on latching
stale_s: 0.5              # refuse to stream if the encoders have not reported
current_limit_ma: 0
require_home_before_start: true   # Start homes to the training ready pose and
                                  # refuses to run if homing did not reach it
home_tolerance_rad: 0.05          # per joint
