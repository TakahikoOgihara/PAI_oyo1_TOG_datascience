# THE STUDY: does MimicGen help? does domain randomisation help? do they
# compose? (design notes §5, project report §4)
#
# Four TRAINING conditions, the 2x2 over the two data-side interventions:
#     A  baseline     mimicgen=off  DR=off
#     B  mimicgen     mimicgen=on   DR=off
#     C  dr           mimicgen=off  DR=on
#     D  mimicgen+dr  mimicgen=on   DR=on
#
# Each trained policy is then evaluated on BOTH test environments:
#     nominal      DR off  -- "the bench exactly as modelled"
#     randomised   DR on   -- "the bench with honest uncertainty in mass,
#                             friction, servo gains, start pose, lighting and
#                             clutter"
#
# EVALUATING ON BOTH IS THE POINT. A single test environment cannot separate
# "this intervention made the policy better" from "this intervention made the
# test easier or harder", and a DR-trained policy measured only on a nominal
# bench will look WORSE than a baseline that overfit to it. The 4x2 grid is
# what turns four numbers into a conclusion a client can act on.
#
# The comparison runs on the BC stage (phases 1 -> 1.5 -> 2 -> 3 -> 4). That is
# deliberate and it is the cheap, clean place to measure: both interventions
# act on the DATASET, and BC is the one stage whose output is a pure function
# of the dataset. Putting PPO or the ACT distillation in the loop would add two
# more stochastic stages between cause and effect -- and would cost 4x the
# whole pipeline instead of 4x twelve minutes.
enable_conditions: [baseline, mimicgen, dr, mimicgen_dr]
# src/ablation.py also defines a DECOMPOSITION of the DR axis, off by default:
#   dr_pose / dr_physics / mg_dr_pose / mg_dr_physics
# "DR helps" is not actionable -- the next question is WHICH part helped, and
# the answer decides what has to be measured on the real bench. Run it into its
# own directory so it does not overwrite the 2x2:
#   bash run_ablation.sh ablation.enable_conditions=[dr_pose,dr_physics] \
#        ablation.out_dir=artifacts/ablation_dr
eval_regimes: [nominal, randomised]
seeds: [0, 1, 2]          # each condition is trained and evaluated under this
                          # many seeds. A success-rate difference measured once
                          # on 256 episodes has a +-3 pp standard error before
                          # seed variance is counted at all; reporting a mean
                          # and a spread is the difference between a result and
                          # an anecdote.
collect_episodes: 6       # per-env batches for the ablation's phase 1
bc_epochs: 100            # ablation runs are shorter than the full pipeline's
                          # 150 epochs; identical across conditions, which is
                          # what matters for a comparison
eval_episodes: 4          # x eval.num_envs (64) = 256 episodes per cell
match_data: false         # true = subsample every condition's dataset down to
                          # the smallest one's transition count before training.
                          # MimicGen adds DATA VOLUME as well as DATA DIVERSITY,
                          # and with this false the B/D columns enjoy both. Run
                          # it both ways: the gap between them is exactly "how
                          # much of MimicGen's gain is just more rows".
out_dir: artifacts/ablation
