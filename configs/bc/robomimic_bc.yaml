# robomimic BC settings -- the same library and the same entry point
# (robomimic.scripts.train.train) ARM_BCRL005 used. robomimic is NVIDIA's
# imitation-learning library and its HDF5 schema is the de-facto interchange
# format for manipulation demonstrations; keeping both is the single most
# transferable thing in this repo.
#
# INSTALL NOTE (ARM_BCRL006): robomimic is installed with --no-deps because
# its `egl_probe` dependency is a CMake C extension that only exists to pick a
# GPU for robosuite's offscreen renderer -- machinery this project never
# touches (experiment.rollout.enabled = False; closed-loop evaluation is
# src/evaluate.py's job, in MuJoCo). setup_env.sh installs the real runtime
# dependencies explicitly. See change log §7.
#
# ROLE: this low_dim BC is the TEACHER-SIDE bootstrap -- it initialises the
# PPO actor (phase 6), and the RL champion then generates the camera demos the
# visuomotor stage trains on (phases 7-8). The deployed edge policy is the
# visuomotor one; this MLP never needs the object pose at runtime.
#
# hidden MUST equal rl.hidden (configs/rl/ppo.yaml): phase 6 copies these MLP
# weights layer-by-layer into the PPO actor, which requires identical shapes
# (and rl.activation=relu to match robomimic's MLP default).
hidden: [256, 128, 64]     # algo.actor_layer_dims
lr: 0.001
weight_decay: 0.00001
batch_size: 256
num_epochs: 150
val_split: 0.15
outlier_z: 4.0             # preprocess z-score clip threshold (flat channels)
# false (default): low_dim BC -- the variant BC->RL fine-tuning consumes.
# true: robomimic's VisualCore image-BC variant, kept as a baseline switch --
# NOT used for RL initialisation and NOT the deployed visuomotor policy.
use_rgb: false

# --- wrist-camera DATA-QUALITY GATE (src/preprocess.py) -------------------
# ARM_BCRL002 asked a human to "review camera_samples.png". A human did, and
# passed an image set that was almost uniformly white, so the deployed policy
# trained on frames carrying no information about where the block is. "Look at
# the picture" is not a gate. These are. Phase 2 measures them on the collected
# frames and STOPS the pipeline rather than spending GPU hours on blank input.
image_quality:
  enable: true
  max_mean: 200.0        # mean pixel value (0-255) over the dataset
  min_mean: 30.0         # too dark is just as unusable as too bright
  max_saturated: 0.15    # fraction of pixels >= 250 in ANY channel
  min_dynamic_range: 40.0  # p95 - p5 of the luminance histogram
  min_red_frames: 0.50   # fraction of frames where the red block is detectable
