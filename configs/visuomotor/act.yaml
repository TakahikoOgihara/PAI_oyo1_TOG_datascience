# Deployed visuomotor policy: ACT (Action Chunking with Transformers, Zhao et
# al. RSS 2023) by default; Diffusion Policy with visuomotor.type=diffusion.
# Both implementations are ARM_BCRL005's, unchanged (arm_policy/).
type: act
source: rl_teacher         # rl_teacher | expert
distill:
  # ARM_BCRL005 collected ~512 teacher rollouts. Here the wrist camera renders
  # at ~50 frames/s regardless of backend or process count on the reference
  # machine, so 512 demos would be ~25 min of pure rendering. 8 envs x 24
  # batches x 6 workers ~ 1150 demos' worth of ATTEMPTS is not the constraint;
  # frames are. 192 successful demos (~21k frames) trains ACT to the release
  # gate and costs ~7 min. Raise it if you have the budget -- distillation
  # volume is the second-strongest lever on the final number (src/infer.py).
  num_envs: 8
  episodes: 4              # per-env batches per worker
  workers: 0               # 0 = auto, same sharding as collect
  min_success: true        # keep successful episodes only
image_size: 224            # must match env.camera width/height
qpos_dim: 7                # 6 arm joints + previous gripper command
chunk: 20                  # predicted action chunk length (1 s at 20 Hz)
execute_horizon: 10        # receding horizon: execute this many, then re-infer
train:
  batch_size: 64
  epochs: 60
  require_pretrained_backbone: true   # a randomly-initialised ResNet18 cannot
                                      # be trained on a few hundred wrist-cam
                                      # trajectories, and silently shipping one
                                      # is how ARM_BCRL002 deployed a policy
                                      # that could not see. false = deliberate
                                      # no-pretraining ablation only.
  lr: 0.0001
  weight_decay: 0.0001
  val_split: 0.1
  num_workers: 4
  aug:
    # Light domain randomisation at TRAINING time -- the standard low-cost way
    # to cover hue/exposure/viewpoint drift with zero extra rendering. The
    # physical axes are randomised in the simulator instead
    # (configs/env/mycobot_pickplace.yaml domain_rand).
    enable: true
    brightness: 0.25
    contrast: 0.25
    saturation: 0.25
    hue: 0.05
    shift_px: 10
    rotate_deg: 5.0        # +- deg of random image ROLL: the wrist camera is
                           # bolted to a flange by hand, and roll is precisely
                           # what a single camera cannot recover from
act:
  dim_model: 256
  n_heads: 8
  dim_feedforward: 1024
  enc_layers: 3
  dec_layers: 3
  latent_dim: 32
  kl_weight: 10.0
  dropout: 0.1
diffusion:
  obs_embed_dim: 256
  down_dims: [256, 512]
  diffusion_steps: 100     # training noise schedule length
  ddim_steps: 8            # inference denoising steps (edge budget)
