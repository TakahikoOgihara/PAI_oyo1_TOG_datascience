# myCobot 280 Pi（2023年版、Raspberry Pi 4B）の pick & place 環境。
# mujoco_sim/env.py が読む（MuJoCo 3.x、ローカルCPU物理）。
#
# ロボットモデルは assets/build_mycobot_mjcf.py が
# deploy/raspi/mycobot_fk.py の関節原点から生成する。仮想床、解析IK、
# Raspberry Pi 側のガードが使うのと同じ連鎖。ダウンロードもメッシュも
# 無い。ARM_BCRL005 のビューアで描画できなかったリンクを直したのも、
# この作り方に変えたから。
#
# タスク。赤い円柱ワーク（参考写真: assets/block_reference.jpg。台の上の
# 直径約30mmの木の円柱）を見つけ、掴み、持ち上げ、5cm動かして置く
# （成功 = 持ち上げて放し、静止した状態で、目標から place_tol 以内に
# ワークがあること）。
sim_dt: 0.0041666667      # 1/240秒。ARM_BCRL005 の PhysX の倍の刻み。MuJoCo は
                          # 位置サーボのばねを陽解法で積分し、指のサーボ
                          # （12gのパッドに kp 300）がモデル中でいちばん硬い。
                          # 1/120秒では際どく、1/240秒なら無条件で安定する。
                          # コストは問題にならない。この機械の律速は物理では
                          # なく描画で、刻みを細かくしても描く枚数は
                          # 増えないから。
decimation: 12            # 12 * 1/240 = 0.05秒
control_dt: 0.05          # 20Hz制御。ARM_BCRL005 および
                          # deploy/raspi/safety.py の刻みと完全に同じ
episode_len_steps: 240    # 12秒。掴んで置くには、持ち上げるだけより時間が要る
action_scale: 0.05        # 1制御ステップ・単位行動あたりの rad（関節の差分）
gripper_open: 0.028       # 開いたときの指の直動位置（中心からのm）
robot:
  mjcf_path: assets/mjcf/mycobot_280_pi.xml   # run_all.sh のフェーズ0が生成する
  # ready 姿勢。環境座標で TCP ~ (0.2556, 0.000, 0.1001)、ツールは真下向き
  # （assets/build_mycobot_mjcf.py が MuJoCo と突き合わせて検証する）
  default_joint_pos: [0.25, -1.0, -0.1, -0.5, 0.0, 0.0]
  # PDサーボのゲイン。myCobot の実サーボは位置制御で、このゲインなら
  # 約0.1kgのリンクを振動なくしっかり追従させられる。MuJoCo の
  # <position kp kv> は kp*(target-q) - kv*qd を与える。Isaac Lab の
  # ImplicitActuatorCfg(stiffness, damping) と同じ法則。
  arm_stiffness: 50.0
  arm_damping: 5.0
  arm_effort_limit: 5.0        # N*m。小型のホビー級サーボ
  arm_velocity_limit: 2.0      # rad/s（ここでは記録用。MuJoCo が制限するのは力で、
                               # 行動項の有界なリードが既に指令レートを
                               # 0.15 rad/step に抑えている）
  finger_stiffness: 300.0
  finger_damping: 20.0
  finger_effort_limit: 30.0    # N
  finger_velocity_limit: 0.1   # m/s
object:
  # 赤く塗った木の円柱（参考写真を見ること）。直径約30mm
  radius: 0.015
  height: 0.030
  mass: 0.020            # 公称値。環境ごとに domain_rand.object_mass でランダム化
  color: [0.75, 0.08, 0.08]
  spawn_x: [0.16, 0.23]   # 環境座標での一様な出現窓。FKで到達性を確認済み
  spawn_y: [-0.08, 0.02]  # （ツール真下の姿勢で半径 0.15〜0.25m を覆う）
place_offset: [0.0, 0.05, 0.0]  # 「5cm離れた所に置く」。目標 = 出現位置 + オフセット
place_tol_xy: 0.020       # |obj_xy - target_xy| がこれ未満で置けた扱い…
place_max_z: 0.024        # …かつワークが台に戻っていること（z がこれ未満）
lifted_thresh: 0.055      # 「台から持ち上がった」と数えるワークのz
lift_height: 0.10         # 報酬整形とエキスパートが使う搬送高さ
expert:
  # スクリプトIKの状態機械（接近 -> 下降 -> 把持 -> 持ち上げ -> 搬送 ->
  # 下降 -> 解放 -> 退避）。arm_common/expert.py にあり、arm_common/ik.py
  # （解析ヤコビアンの減衰最小二乗）を通して動かす。
  approach_height: 0.06   # 下降前にワークの上で待つ高さ
  grasp_z_offset: 0.008   # TCP は把持中心そのものなので、指先（TCP + 10mm。
                          # mycobot_fk.py 参照）が台から13mm空くように
                          # 上へずらす
  pos_tol: 0.012          # |eef - target| がこれ未満で経由点に到達と判定
  grasp_steps: 15         # 閉じる間に保持する制御ステップ数
  release_steps: 10       # 開く間に保持する制御ステップ数
  lift_extra: 0.02        # lift_height に対する搬送高さの余裕
  carrot_step: 0.010      # レート制限付きIK目標の、1制御ステップあたりのm
                          # （20Hzで 0.20 m/s）
  ik_damping: 0.05        # DLS の lambda（arm_common/ik.py）
reward:
  # RL微調整の報酬。1制御ステップごと（BCは使わない）。密な段階整形で、
  # ワークに届く、持ち上げる、目標へ運ぶ、置く、に終端の成功ボーナス。
  # 値は ARM_BCRL005 と同一。
  reach: 1.0              # 1 - tanh(10 * |eef - obj|)
  lifted: 2.0             # ワークが lifted_thresh より上
  height: 2.0             # lift_height への接近度
  transport: 4.0          # （持ち上げ条件付き）1 - tanh(10 * |obj_xy - target_xy|)
  place: 8.0              # ワークが目標xyの近くで、かつ台の高さに戻っている
  success: 20.0           # 終端ボーナス
  # 成功するとエピソードが終わるので、密な整形だけだとワークを目標の上で
  # 延々と浮かせている方が、終わらせるより多く稼げる（約9/ステップ x 残り
  # ステップ）。ARM_BCRL002 の PPO はまさにそれを学習した。このボーナスは
  # 残りステップ数に比例して成功を払うので、どの時点でも「早く終わらせる」
  # が「浮かせ続ける」を必ず上回る。
  success_time_bonus: 10.0
  action_penalty: 0.01
  # ツールが面から floor.penalty_band メートル以内に入ると立ち上がる柔らかい
  # 障壁。これが無いと「何かに止められるまで降りる」がシミュレータでは
  # 無料で、実機では破壊的になる。しかも配備した方策は、学習中に一度も
  # 出会わなかった制限と戦い続けることになる。
  floor_penalty: 3.0
domain_rand:
  # 比較実験の軸。src/ablation.py はこのフラグ（と mimicgen.enable）だけを
  # 切り替えて4条件を作る。enable=false は摂動を一切入れないという意味で、
  # 物理も見た目も公称、関節ノイズ無し、邪魔物は固定姿勢に置く。ワーク
  # 自身の出現窓はどの条件でもランダムのまま。それは摂動ではなくタスクの
  # 一部だから。
  # ここは条件に関係なく動かさない。
  enable: true
  joint_noise: 0.08       # リセット時にアーム関節へ加える ± rad の一様乱数。
                          # 0.02 rad（約1度）では、方策が完璧に校正された
                          # ready 姿勢を前提にしてしまう。実機は数度ずれて
                          # いるので、それだと毎エピソードが分布の外から
                          # 始まる。0.08 rad（約4.6度）は、いちばん安い
                          # 頑健化。
  light_intensity: [500.0, 1400.0]   # リセットのたびに引き直す（lighting 参照）
  desk_color_jitter: 0.06   # 台の板のアルベドに加えるチャンネルごとの ± 揺らぎ
  object_color_jitter: 0.08 # object.color へのチャンネルごとの ±。視覚運動方策は
                            # 「赤」を手がかりにする。これは特定のRGB1組に
                            # 張り付くのを防ぐため。フェーズ2の画質ゲートの
                            # red_frame_frac が落ちない程度に小さくしてある。
  distractor: true
  distractor_size: 0.025
  distractor_x: [0.10, 0.30]
  distractor_y: [-0.20, 0.20]

  # --- 物理側の軸。すべてリセット時のプロパティ書き換えで、描画も
  # ステップも増えない。範囲を狭くしているのは意図的。
  object_mass: [0.014, 0.028]      # kg。20g の ±40%。誰も量っていない直径約30mmの
                                   # ブロックの、木の密度と塗装のばらつきを覆う。
  object_friction: [1.0, 1.8]      # 公称1.5。塗った木と台の摩擦は埃と湿度で変わる
                                   # し、平行2指の把持が保つかどうかを決めるのは
                                   # 摩擦。ここでいちばん効く未知量なので、範囲は
                                   # 正直に取ってある。
  actuator_gain_scale: [0.90, 1.10]  # アームの剛性と減衰を同時に倍率で動かす
                                   # （mujoco_sim/domain_rand.py 参照）。±10%
                                   # だけにしてあるのは、スクリプトエキスパートが
                                   # それを通して成功し続けなければならないから。

  # --- 既定でOFFの軸（恒等範囲）。1つONにしたら、フェーズ1を回し直して
  # エキスパートが mimicgen.min_source_success を今も超えるか確認してから
  # 採用すること。エキスパートの成功率がデータ品質の上限になる。
  object_restitution: [0.0, 0.0]   # 木と木はほとんど跳ねない。ONにするなら
                                   # [0.0, 0.1] が正直な範囲。
  joint_friction_scale: [1.0, 1.0] # サーボのギアのモデル化していない固着摩擦。
                                   # [0.8, 1.3] あたりが最初の範囲として妥当。
  joint_armature_scale: [1.0, 1.0] # ロータの反射慣性。上とセットで使う。
  object_push_vel: [0.0, 0.0]      # エピソード途中の外乱（2〜6秒ごと）。
                                   # スクリプトエキスパートは必ず壊れるので、
                                   # RL専用の比較に使うこと。
desk:
  # ロボットの下に置く台の板。その上面が z = 0 で、ロボットの基準面でも
  # 安全床面でもある。
  #
  # 明るい木目ではなく濃い茶色にしてある。ARM_BCRL002 を決めた理由がこれ。
  # アルベド0.78の板は手首カメラを飽和させ、視覚運動方策は情報が
  # ほとんど無い画像で学習されていた。アルベドと照明の両方を落とすと、
  # 描画がセンサの使える範囲に戻る。そしてフェーズ2の画質ゲートが、
  # 信じる代わりにそれを測る。
  size: [1.2, 1.2, 0.02]
  color: [0.20, 0.11, 0.06]
ground:
  color: [0.10, 0.07, 0.05]
lighting:
  # ドメインランダム化OFFのときの露出で、上のDR範囲の中心。フェーズ2の
  # 画質ゲート（bc.image_quality）が検証する。画像が飽和して出てくるなら、
  # 真っ白な画像で学習する代わりにパイプラインが止まる。
  # mujoco_sim/scene.py がこれを MuJoCo の light diffuse に写す。
  intensity: 900.0
floor:
  # 安全面。シミュレータ（mujoco_sim/env.py）と実機（deploy/raspi/safety.py）
  # が、同じ順運動学（deploy/raspi/mycobot_fk.py）を通して同一に強制する。
  # 片方だけを直すことはできない作りにしてある。
  z: 0.0                  # ロボット基準座標での台の上面（0 = アームを台に
                          # 平置きでボルト止め）。下駄の上なら実測して、
                          # Pi 側では --floor-z で渡す
  clearance: 0.005        # どのツール点も floor.z + これ（5mm）より下に
                          # 行ってはならない。エキスパートの把持は8mm
                          # 空けるので、通常運転でガードは発火しない
  penalty_band: 0.020     # 報酬の減衰は面から20mm上で始まる
  terminate_below: 0.000  # ガードを越えて面の下へこれだけ押し込まれたら、
                          # エピソードを失敗として終える
camera:
  # 手首カメラ。2023年版 myCobot のカメラフランジのUSBカメラは、グリッパの
  # すぐ上に乗る。シミュレータのカメラは joint6_flange 座標に付けてあり、
  # その +Z 軸がツール軸そのもの。
  #
  # >>> 先に仕様を合わせること。実カメラを繋いで
  # deploy/jetson/check_camera.py を走らせ、ここの width/height/hfov_deg を
  # デモ収集の前に設定する。シミュレータのカメラが実カメラの縦横比と画角に
  # 合っていないと、方策は二度と出会わない幾何で学習することになる。
  # ここだけは手順を飛ばさないこと。
  width: 224
  height: 224
  hfov_deg: 60.0
  # joint6_flange 座標の中での取り付け姿勢（m / クォータニオン wxyz、
  # "ros" 規約で +Z が光軸）。横に4cmずらし、光軸を把持中心線の方へ25度
  # 倒してあるので、接近と下降の間も指先とその下のワークが画角に残る。
  # mujoco_sim/scene.py が、これを MuJoCo の -Z前方のカメラ規約に変換する。
  pos: [0.0, -0.04, 0.025]
  rot_wxyz: [0.976, -0.216, 0.0, 0.0]
  clipping: [0.02, 2.0]
