# myCobot 280 Pi (2023, Raspberry Pi 4B) pick-and-place environment,
# consumed by mujoco_sim/env.py (MuJoCo 3.x, local CPU physics).
#
# The robot model is generated by assets/build_mycobot_mjcf.py from the joint
# origins in deploy/raspi/mycobot_fk.py -- the same chain the virtual floor,
# the analytic IK and the Raspberry Pi guard use. There is no download step and
# no mesh: see change log §2 for why (it is also what fixed the links
# that would not render in ARM_BCRL005's viewer).
#
# Task: find the red cylinder block (photo: assets/block_reference.jpg --
# a ~30 mm wooden cylinder on a bench), grasp it, lift it, move it 5 cm and set
# it down (success = block placed within place_tol of the target after having
# been lifted, released, and at rest).
sim_dt: 0.0041666667      # 1/240 s. Twice ARM_BCRL005's PhysX rate: MuJoCo
                          # integrates the position-servo spring explicitly, and
                          # the finger servo (kp 300 on a 12 g pad) is the
                          # stiffest element in the model. 1/120 s is marginal
                          # for it; 1/240 s is unconditionally stable and costs
                          # nothing that matters, because rendering -- not
                          # physics -- is this machine's bottleneck.
decimation: 12            # 12 * 1/240 = 0.05 s
control_dt: 0.05          # 20 Hz control -- IDENTICAL to ARM_BCRL005 and to
                          # deploy/raspi/safety.py's tick
episode_len_steps: 240    # 12 s -- pick AND place needs more time than lift-only
action_scale: 0.05        # rad per control step per unit action (joint deltas)
gripper_open: 0.028       # finger prismatic position (m from center) when open
robot:
  mjcf_path: assets/mjcf/mycobot_280_pi.xml   # built by run_all.sh phase 0
  # "ready" pose: TCP ~ (0.2556, 0.000, 0.1001) in the env frame, tool pointing
  # straight down (asserted against MuJoCo by assets/build_mycobot_mjcf.py)
  default_joint_pos: [0.25, -1.0, -0.1, -0.5, 0.0, 0.0]
  # PD servo gains. myCobot's own servos are position-controlled; these gains
  # give firm tracking for the ~0.1 kg links without oscillation. MuJoCo's
  # <position kp kv> applies kp*(target-q) - kv*qd, i.e. the same law Isaac
  # Lab's ImplicitActuatorCfg(stiffness, damping) applied.
  arm_stiffness: 50.0
  arm_damping: 5.0
  arm_effort_limit: 5.0        # N*m -- small hobby-class servos
  arm_velocity_limit: 2.0      # rad/s (documentary here: MuJoCo limits force,
                               # and the action term's bounded lead already
                               # caps the commanded rate at 0.15 rad/step)
  finger_stiffness: 300.0
  finger_damping: 20.0
  finger_effort_limit: 30.0    # N
  finger_velocity_limit: 0.1   # m/s
object:
  # a red-painted wooden CYLINDER (see the reference photo), ~30 mm diameter
  radius: 0.015
  height: 0.030
  mass: 0.020            # nominal; randomised per env by domain_rand.object_mass
  color: [0.75, 0.08, 0.08]
  spawn_x: [0.16, 0.23]   # uniform spawn window in the env frame, reach-checked
  spawn_y: [-0.08, 0.02]  # by FK (TCP-down poses cover radius 0.15..0.25 m)
place_offset: [0.0, 0.05, 0.0]  # "put it down 5 cm away": target = spawn + offset
place_tol_xy: 0.020       # placed when |obj_xy - target_xy| < this ...
place_max_z: 0.024        # ... and the block is back on the bench (z < this)
lifted_thresh: 0.055      # object z that counts as "lifted off the bench"
lift_height: 0.10         # transport height for reward shaping / expert
expert:
  # Scripted IK state machine (approach -> descend -> grasp -> lift ->
  # transport -> lower -> release -> retreat), arm_common/expert.py, driven
  # through arm_common/ik.py (damped least squares on the analytic Jacobian).
  approach_height: 0.06   # hover height above the block before descending
  grasp_z_offset: 0.008   # the TCP sits AT the grasp centre; bias up so the
                          # FINGERTIPS (TCP + 10 mm, see mycobot_fk.py) clear
                          # the bench by 13 mm
  pos_tol: 0.012          # waypoint reached when |eef - target| < pos_tol
  grasp_steps: 15         # control steps held while closing
  release_steps: 10       # control steps held while opening
  lift_extra: 0.02        # transport height margin above lift_height
  carrot_step: 0.010      # m per control step for the rate-limited IK target
                          # (0.20 m/s at 20 Hz)
  ik_damping: 0.05        # DLS lambda (arm_common/ik.py)
reward:
  # RL fine-tuning reward, PER CONTROL STEP (BC uses none). Dense staged
  # shaping: reach the block, lift it, carry it to the target, place it, with a
  # terminal success bonus. Values identical to ARM_BCRL005.
  reach: 1.0              # 1 - tanh(10 * |eef - obj|)
  lifted: 2.0             # block above lifted_thresh
  height: 2.0             # progress toward lift_height
  transport: 4.0          # (lifted-gated) 1 - tanh(10 * |obj_xy - target_xy|)
  place: 8.0              # block near target xy AND back near bench level
  success: 20.0           # terminal bonus
  # Success TERMINATES the episode, so with only dense shaping an agent earns
  # MORE by hovering the block over the target forever (~9/step * remaining
  # steps) than by finishing. PPO learned exactly that in ARM_BCRL002. This
  # bonus pays success proportionally to the steps REMAINING, so finishing
  # early strictly dominates holding, at any time step.
  success_time_bonus: 10.0
  action_penalty: 0.01
  # A soft barrier that grows as the tool enters the last floor.penalty_band
  # metres above the plane. Without it, "descend until something stops me" is
  # free in simulation and destructive on hardware, and the deployed policy
  # spends its life fighting a limit it never met during training.
  floor_penalty: 3.0
domain_rand:
  # THE ABLATION AXIS. src/ablation.py toggles exactly this flag (and
  # mimicgen.enable) to produce the four conditions compared in
  # project report. enable=false means NO perturbation at all:
  # nominal physics, nominal appearance, no joint noise, distractor parked at a
  # fixed pose. The block's own spawn window stays random in every condition,
  # because that is the TASK, not a perturbation.
  enable: true
  joint_noise: 0.08       # +- rad uniform on the arm joints at reset.
                          # 0.02 rad (~1 deg) made the policy assume a
                          # perfectly calibrated ready pose; the real arm is a
                          # few degrees off and every episode would then start
                          # out of distribution. 0.08 rad (~4.6 deg) is the
                          # cheapest robustness there is.
  light_intensity: [500.0, 1400.0]   # re-sampled per reset round (see lighting)
  desk_color_jitter: 0.06   # +- per-channel albedo jitter on the bench board
  object_color_jitter: 0.08 # +- per-channel on object.color. The visuomotor
                            # policy keys on "red"; this stops it keying on one
                            # exact RGB triple. Small enough that the phase-2
                            # image gate's red_frame_frac still fires.
  distractor: true
  distractor_size: 0.025
  distractor_x: [0.10, 0.30]
  distractor_y: [-0.20, 0.20]

  # --- physical axes. All are property writes at reset: zero extra renders,
  # zero extra steps. RANGES ARE NARROW ON PURPOSE (design notes §6).
  object_mass: [0.014, 0.028]      # kg. +-40 % around 20 g covers wood density
                                   # and paint on a ~30 mm block nobody weighed.
  object_friction: [1.0, 1.8]      # nominal 1.5. Painted wood on a bench varies
                                   # with dust and humidity, and friction is
                                   # what decides whether a parallel-jaw grasp
                                   # holds -- the most load-bearing unknown here.
  actuator_gain_scale: [0.90, 1.10]  # multiplies arm stiffness AND damping
                                   # TOGETHER (see mujoco_sim/domain_rand.py).
                                   # +-10 % only: the scripted expert has to
                                   # keep succeeding through it.

  # --- axes that SHIP OFF (identity range). Turn one on, re-run phase 1, and
  # check the expert still clears mimicgen.min_source_success before keeping
  # it: the expert's success rate is the ceiling on data quality.
  object_restitution: [0.0, 0.0]   # wood on wood barely bounces; [0.0, 0.1] is
                                   # the honest range if you want it on.
  joint_friction_scale: [1.0, 1.0] # unmodelled stiction in the servo gearboxes.
                                   # [0.8, 1.3] is a reasonable first range.
  joint_armature_scale: [1.0, 1.0] # reflected rotor inertia; pairs with the above.
  object_push_vel: [0.0, 0.0]      # mid-episode disturbance (every 2-6 s). It
                                   # WILL break the scripted expert, so use it
                                   # for an RL-only ablation.
desk:
  # Bench board under the robot. Its top face is z = 0, which is also the
  # robot's base plane and the safety floor plane.
  #
  # DARK BROWN, not light wood, for a reason that decided ARM_BCRL002: a
  # 0.78-albedo board saturated the wrist camera, and the visuomotor policy was
  # trained on images with essentially no information in them. Lowering both
  # the albedo and the light puts the render back in the sensor's usable range
  # -- and the phase-2 image gate now measures that instead of trusting it.
  size: [1.2, 1.2, 0.02]
  color: [0.20, 0.11, 0.06]
ground:
  color: [0.10, 0.07, 0.05]
lighting:
  # Exposure when domain randomisation is off, and the centre of the DR range
  # above. Validated by the phase-2 image-quality gate (bc.image_quality): if
  # the frames come out saturated the pipeline STOPS instead of training on
  # white images. mujoco_sim/scene.py maps this onto MuJoCo's light diffuse.
  intensity: 900.0
floor:
  # SAFETY PLANE, enforced identically in the simulator (mujoco_sim/env.py) and
  # on the robot (deploy/raspi/safety.py) through the same forward kinematics
  # (deploy/raspi/mycobot_fk.py).
  z: 0.0                  # bench top in the robot base frame (0 = arm bolted
                          # flat on the bench). MEASURE it if the base sits on
                          # a riser and set it on the Pi with --floor-z
  clearance: 0.005        # no tool point may go below floor.z + this (5 mm).
                          # The expert grasp clears it by 8 mm, so the guard
                          # never fires in normal operation
  penalty_band: 0.020     # reward taper starts 20 mm above the plane
  terminate_below: 0.000  # episode ends as a FAILURE if the tool is pushed
                          # this far under the plane despite the guard
camera:
  # WRIST camera: the real 2023 myCobot camera-flange USB camera rides just
  # above the gripper. The sim camera is mounted in the joint6_flange frame,
  # whose +Z axis IS the tool axis.
  #
  # >>> SPEC-CHECK FIRST (operations guide §2-1): plug the real camera in,
  # run deploy/jetson/check_camera.py, and set width/height/hfov_deg here
  # BEFORE collecting demos -- the sim camera must match the real camera's
  # aspect ratio and field of view or the policy trains on a geometry it never
  # sees again.
  width: 224
  height: 224
  hfov_deg: 60.0
  # mount pose INSIDE the joint6_flange frame (metres / quaternion wxyz, "ros"
  # convention: +Z = optical axis). 4 cm lateral offset, optical axis pitched
  # 25 deg back toward the grasp centreline, so the fingertips and the block
  # below stay in frame during approach/descend. mujoco_sim/scene.py converts
  # this to MuJoCo's -Z-forward camera convention.
  pos: [0.0, -0.04, 0.025]
  rot_wxyz: [0.976, -0.216, 0.0, 0.0]
  clipping: [0.02, 2.0]
